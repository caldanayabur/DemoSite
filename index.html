<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DemoSite</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <h1>DemoSite</h1>
    <p>A tiny static website used to demonstrate how to run and edit a simple project.</p>
  </header>

  <main class="site-main">
    <section>
      <h2>Welcome</h2>
      <p>
        Edit <code>index.html</code>, <code>style.css</code>, or
        <code>script.js</code> and refresh your browser to see the changes.
      </p>
      <button id="greet-button">Click me</button>
      <p id="greet-output"></p>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; <span id="year"></span> DemoSite</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
